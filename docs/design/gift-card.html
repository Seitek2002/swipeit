<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карточка подарка</title>
<!--
  Эталон карточки подарка в ленте (DESIGN.md §7 «GiftCard», TASKS T19b).
  Поведение повторяет ../tap-tap/src/pages/feed/ui/swipe-card.tsx,
  цвета и шрифты — токены SwipeIt. Кадры 1–4: сверху, начало
  прокрутки, подробности, карточку тянут вправо. Карточки живые:
  их можно прокручивать, листать фото тапом по краям, тап по названию
  прокручивает к подробностям. Жест свайпа здесь не сделан — его физика
  описана в DESIGN.md §6 и есть в tap-tap.

  Кадры 5–8 и переключатель «Сеть» сверху — смена и загрузка фото
  (DESIGN.md §7 GiftCard «Смена и загрузка фото», TECH_SPEC §6
  «Предзагрузка фото колоды»): 100 ms — перелив, 400 ms — бант,
  ошибка — «Фото не загрузилось». Переключатель меняет сеть во всех
  живых карточках, в том числе «Как было до правки» для сравнения.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --velvet: #2a1024; --velvet-2: #3a1832; --velvet-3: #4a2241;
    --line: rgb(255 241 243 / 0.12);
    --paper: #fff1f3; --paper-2: #f6e1e7; --ink: #2a1024; --ink-soft: #7a5a6e;
    --rose: #cba8bc; --mandarin: #ff8a3d; --mandarin-ink: #b8460e;
    --mint: #8fe3c6; --champagne: #ffd27a;
    --display: "Cormorant Garamond", "Times New Roman", serif;
    --sans: "Onest", system-ui, sans-serif;
    --ease-out-soft: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #1c0a18; color: var(--paper); font-family: var(--sans);
    display: flex; gap: 28px; padding: 28px; flex-wrap: wrap; justify-content: center;
  }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  figcaption { font-size: 15px; color: var(--rose); }

  /* ── Телефон и экран «Подарки» ─────────────────────────── */
  .phone {
    position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 44px;
    border: 1px solid var(--line);
    background:
      radial-gradient(120% 60% at 50% -10%, rgb(255 138 61 / 0.10), transparent 60%),
      var(--velvet);
    display: flex; flex-direction: column;
  }
  .hdr { height: 56px; margin-top: 8px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; }
  .hdr h1 { margin: 0; font: 600 32px/36px var(--display); }
  .hdr .acts { display: flex; gap: 8px; align-items: center; }
  .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; color: var(--paper); }
  .ava { width: 36px; height: 36px; border-radius: 50%; background: #f2c9d6; color: var(--ink); display: grid; place-items: center; font-weight: 600; font-size: 15px; }
  .ribbon { margin: 4px 16px 0; display: flex; align-items: center; gap: 10px; }
  .ribbon .segs { display: flex; gap: 4px; }
  .ribbon .segs i { width: 22px; height: 6px; border-radius: 3px; background: var(--velvet-3); }
  .ribbon .segs i.on { background: var(--mandarin); }
  .ribbon span { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--rose); }
  .chips { margin: 10px 16px 0; display: flex; gap: 8px; }
  .chip { height: 32px; padding: 0 12px; border-radius: 999px; background: var(--velvet-3); font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .deck { position: relative; flex: 1; margin: 12px 16px 0; min-height: 0; }
  .tabbar {
    margin: 12px 12px 12px; height: 64px; border-radius: 999px; flex: none;
    background: rgb(58 24 50 / 0.92); border: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(4, 1fr); align-items: center;
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--rose); position: relative; }
  .tab.on { color: var(--paper); }
  .tab.on::after { content: ""; position: absolute; bottom: -9px; width: 4px; height: 4px; border-radius: 50%; background: var(--mandarin); }

  /* ── Карточка ──────────────────────────────────────────── */
  .card {
    position: absolute; inset: 0; border-radius: 24px; background: var(--velvet);
    overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain;
    box-shadow: 0 18px 40px -12px rgb(10 0 8 / 0.55), 0 4px 10px rgb(10 0 8 / 0.25);
  }
  .card::-webkit-scrollbar { display: none; }
  .card.under { transform: scale(0.95); overflow: hidden; pointer-events: none; }

  .photo { position: relative; height: 100%; overflow: hidden; display: flex; flex-direction: column; }
  .photo .fill { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; filter: blur(28px) saturate(1.1); }
  .photo .pic-area { position: relative; flex: 1; min-height: 0; margin-bottom: -28px; }
  .photo .pic { width: 100%; height: 100%; object-fit: contain; display: block; }
  .scrim-top { position: absolute; inset: 0 0 auto; height: 72px; background: linear-gradient(rgb(42 16 36 / 0.38), transparent); pointer-events: none; }
  .segs-photo { position: absolute; inset: 12px 12px auto; display: flex; gap: 6px; pointer-events: none; }
  .segs-photo i { height: 4px; flex: 1; border-radius: 2px; background: rgb(255 241 243 / 0.45); }
  .segs-photo i.on { background: var(--paper); }
  .tap { position: absolute; top: 0; bottom: 0; width: 50%; border: 0; background: none; cursor: pointer; }
  .tap.l { left: 0; } .tap.r { right: 0; }
  .tint { position: absolute; inset: 0; pointer-events: none; }
  .verdict {
    position: absolute; left: 50%; top: 42%; width: 64px; height: 64px; margin: -32px 0 0 -32px;
    border-radius: 50%; background: var(--paper); color: var(--ink); display: grid; place-items: center;
    box-shadow: 0 10px 24px rgb(10 0 8 / 0.3); opacity: 0; pointer-events: none;
  }
  .info {
    position: relative; padding: 44px 16px 88px; color: var(--paper);
    background: linear-gradient(to bottom, rgb(42 16 36 / 0) 0, rgb(42 16 36 / 0.88) 44px, rgb(42 16 36 / 0.96) 100%);
  }
  .pill { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; background: var(--mint); color: var(--ink); font-size: 12px; font-weight: 600; }
  .info-btn { all: unset; cursor: pointer; display: flex; width: 100%; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 8px; }
  .info h2 { margin: 0; font: 600 26px/30px var(--display); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { margin-top: 6px; display: flex; align-items: center; gap: 12px; }
  .price { font-size: 17px; line-height: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .store { font-size: 13px; font-weight: 500; color: rgb(255 241 243 / 0.8); display: flex; align-items: center; gap: 4px; }
  .swatches { display: flex; gap: 4px; }
  .swatches i { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 1.5px rgb(255 241 243 / 0.7); }

  .mini { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--velvet); }
  .mini img { width: 36px; height: 36px; border-radius: 10px; object-fit: contain; background: #fff; }
  .mini span { font-size: 17px; line-height: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .details { padding: 0 0 12px; }
  .sec { margin-top: 12px; border-radius: 16px; background: var(--velvet-2); padding: 16px; }
  .sec:first-child { margin-top: 0; }
  .sec-t { display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--rose); }
  .sec-b { margin-top: 8px; font-size: 15px; line-height: 22px; }
  .sec-b p { margin: 0 0 8px; } .sec-b p:last-child { margin: 0; }
  .vchips { display: flex; flex-wrap: wrap; gap: 8px; }
  .vchip { height: 36px; padding: 0 12px; border-radius: 999px; background: var(--velvet-3); display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; border: 0; color: var(--paper); font-family: inherit; }
  .vchip i { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 0 1px rgb(255 241 243 / 0.5); }
  .vchip.on { background: var(--paper); color: var(--ink); }
  .note { margin-top: 10px; font-size: 13px; color: var(--rose); }
  .offer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .offer + .offer { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .offer b { font-weight: 600; }
  .offer .go { display: flex; align-items: center; gap: 4px; color: var(--mandarin); font-size: 15px; font-weight: 600; text-decoration: none; }
  .ichips { display: flex; flex-wrap: wrap; gap: 8px; }
  .ichips span { height: 32px; padding: 0 12px; border-radius: 999px; background: var(--velvet-3); display: flex; align-items: center; font-size: 13px; font-weight: 500; }

  .bar { position: sticky; bottom: 0; z-index: 3; padding: 0 20px 16px; }
  .bar .back { position: absolute; inset: -24px 0 0; pointer-events: none; opacity: 0;
    background: linear-gradient(to top, rgb(42 16 36 / 0.7), rgb(42 16 36 / 0.4) 55%, rgb(42 16 36 / 0)); backdrop-filter: blur(3px); }
  .bar .row { position: relative; display: flex; align-items: center; justify-content: space-between; }
  .bar .mid { display: flex; gap: 20px; }
  .b { border: 0; display: grid; place-items: center; border-radius: 50%; cursor: pointer; padding: 0; }
  .b.s { width: 44px; height: 44px; }
  .b.l { width: 56px; height: 56px; backdrop-filter: blur(30px); box-shadow: inset 2px -1px 2px rgb(255 255 255 / 0.16); }
  .b[disabled] { opacity: 0.4; }

  /* ── Загрузка фото (DESIGN §7 GiftCard «Смена и загрузка фото») ── */
  .photo { background: var(--velvet-2); }
  .photo[data-state="wave"] .pic, .photo[data-state="bow"] .pic, .photo[data-state="error"] .pic { opacity: 0; }
  .photo[data-cover] .fill { opacity: 0; }
  .pic.fade, .fill.fade { transition: opacity 160ms var(--ease-out-soft); }
  .load { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .photo[data-state="wave"] .load, .photo[data-state="bow"] .load, .photo[data-state="error"] .load { opacity: 1; }
  /* Вуаль: на белых фото без неё перелив не виден. */
  .load .veil { position: absolute; inset: 0; background: rgb(42 16 36 / 0.28); }
  .photo[data-cover] .load .veil { background: none; }
  .photo[data-state="error"] .load .veil { background: rgb(42 16 36 / 0.55); }
  .load .wave { position: absolute; inset: 0; overflow: hidden; }
  .load .wave::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.35), transparent); animation: wave 1.4s ease-in-out infinite; }
  .photo[data-state="error"] .load .wave { display: none; }
  @keyframes wave { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  /* Бант из прелоадера на маленькой бумажной плашке. */
  .lbow { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; opacity: 0; transform: scale(0.85); transition: opacity 200ms var(--ease-out-soft), transform 200ms var(--ease-out-soft); }
  .photo[data-state="bow"] .lbow { opacity: 1; transform: scale(1); }
  .lbow-b { position: absolute; inset: 0; animation: breathe 1.6s ease-in-out infinite; }
  .lbow-b > i { position: absolute; inset: 0; border-radius: 16px; }
  .lbow-shadow { box-shadow: 0 10px 24px -8px rgb(10 0 8 / 0.5), 0 2px 6px rgb(10 0 8 / 0.25); }
  .lbow-glow { box-shadow: 0 0 18px rgb(255 138 61 / 0.4); opacity: 0; animation: glow 1.6s ease-in-out infinite; }
  .lbow-plate { display: grid; place-items: center; background: var(--paper); box-shadow: 0 1px 0 rgb(255 255 255 / 0.6) inset; }
  .lbow-plate svg { display: block; width: 36px; height: 25px; overflow: visible; animation: sway 1.4s ease-in-out infinite; }
  .bow-g { fill: var(--mandarin); stroke: var(--mandarin); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .bow-g .tail { fill: none; stroke-width: 4; }
  .bow-g .fold { fill: none; stroke: var(--mandarin-ink); stroke-width: 1.6; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes glow { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
  @keyframes sway { 0%, 100% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(-4deg) scale(1.06); } }

  .err { position: absolute; left: 50%; top: 50%; z-index: 4; transform: translate(-50%, -50%); width: 220px; display: none; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: var(--paper); }
  .photo[data-state="error"] .err { display: flex; }
  .err p { margin: 0; font-size: 13px; line-height: 18px; font-weight: 500; }
  .retry { pointer-events: auto; position: relative; margin-top: 4px; height: 36px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--velvet-3); color: var(--paper); font: 600 15px/20px var(--sans); cursor: pointer; }
  .retry::before { content: ""; position: absolute; inset: -4px; }

  @media (prefers-reduced-motion: reduce) {
    .load .wave::after, .lbow-b, .lbow-glow, .lbow-plate svg { animation: none !important; }
    .lbow, .pic.fade, .fill.fade { transition: none !important; }
  }

  /* ── Панель сверху: сеть и шкала времени ───────────────── */
  .panel { flex: 0 0 100%; max-width: 1650px; display: flex; flex-direction: column; gap: 14px; }
  .panel h2 { margin: 0; font: 600 26px/30px var(--display); }
  .net { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .net span { font-size: 15px; font-weight: 600; margin-right: 4px; }
  .net button { height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--velvet-3); color: var(--paper); font: 500 14px/20px var(--sans); cursor: pointer; }
  .net button[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
  .hint { margin: 0; max-width: 78ch; font-size: 14px; line-height: 20px; color: var(--rose); }
  .steps { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-wrap: wrap; row-gap: 18px; }
  .steps li { position: relative; min-width: 160px; padding: 14px 18px 0 0; border-top: 2px solid var(--velvet-3); font-size: 14px; line-height: 20px; }
  .steps li::before { content: ""; position: absolute; top: -6px; left: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--rose); }
  .steps li.ok::before { background: var(--mint); }
  .steps b { display: block; font-weight: 600; color: var(--rose); font-variant-numeric: tabular-nums; }
</style>
</head>

  <svg data-i="img-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" x2="22" y1="2" y2="22"/><path d="M10.41 10.41a2 2 0 1 1-2.83-2.83"/><line x1="13.5" x2="6" y1="13.5" y2="21"/><line x1="18" x2="21" y1="12" y2="15"/><path d="M3.59 3.59A1.99 1.99 0 0 0 3 5v14a2 2 0 0 0 2 2h14c.55 0 1.052-.22 1.41-.59"/><path d="M21 15V5a2 2 0 0 0-2-2H9"/></svg>
  <svg data-i="heart-o" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
</template>

<script>
const IMG = (id, n) => `../../catalog/products/${id}/${n}.webp`;
const PRODUCTS = {
  jbl: {
    id: "p_0044", title: "Колонка JBL Flip 7", category: "Техника", price: "9 800 сом",
    stores: ["Wildberries"], photos: 3,
    description: ["Портативная колонка JBL новой модели Flip 7 — компактная, её легко взять с собой на природу или в гости."],
    offers: [["Wildberries", "9 800 сом"]], interests: ["Музыка", "Гаджеты", "Путешествия"],
  },
  bag: {
    id: "p_0018", title: "Сумка-кроссбоди из натуральной кожи", category: "Одежда и аксессуары", price: "2 740 сом",
    stores: ["AliExpress"], photos: 5,
    description: ["Небольшая сумка из натуральной кожи с верхней ручкой и ремнём через плечо. Размер около 23 × 17 × 9 см."],
    colors: [["Коричневый", "#5A3422"], ["Чёрный", "#1E1E1E"], ["Бордовый", "#6B1E2A"], ["Тёмно-серый", "#55585C"]],
    offers: [["AliExpress", "2 740 сом"]], interests: ["Мода"],
  },
  engine: {
    id: "p_0048", title: "Конструктор Mould King: двигатель V8 с мотором", category: "Хобби и творчество", price: "5 090 сом",
    stores: ["AliExpress"], photos: 3,
    description: ["Сборная модель двигателя V8 (набор 10171) с электромотором: после сборки поршни двигаются."],
    offers: [["AliExpress", "5 090 сом"]], interests: ["Авто", "Творчество", "Гаджеты"],
  },
};
const icon = (name, size) => {
  const svg = document.querySelector(`#icons`).content.querySelector(`[data-i="${name}"]`).cloneNode(true);
  svg.setAttribute("width", size); svg.setAttribute("height", size); svg.removeAttribute("data-i");
  return svg.outerHTML;
};

/* Бант — знак SwipeIt, как в прелоадере (quick-start.html, frontend/src/shared/ui/bow) */
const BOW = `<svg viewBox="0 0 64 44" aria-hidden="true"><g class="bow-g">
  <path d="M32 20C24 5 5 2 5 14s19 11 27 6z"/><path d="M32 20c8-15 27-18 27-6s-19 11-27 6z"/>
  <path class="tail" d="M30 23c-4 8-8 13-14 19"/><path class="tail" d="M34 23c4 8 8 13 14 19"/>
  <path class="fold" d="M30 19c-6-6-14-8-18-6M34 19c6-6 14-8 18-6"/><circle cx="32" cy="20" r="5"/></g></svg>`;

const cardHTML = (p, under) => `
  <div class="card${under ? " under" : ""}">
    <div class="photo">
      <img class="fill" alt="" src="${IMG(p.id, 1)}">
      <div class="pic-area"><img class="pic" alt="${p.title}" src="${IMG(p.id, 1)}">
        <div class="load">
          <i class="veil" aria-hidden="true"></i><i class="wave" aria-hidden="true"></i>
          <span class="lbow" aria-hidden="true"><span class="lbow-b"><i class="lbow-shadow"></i><i class="lbow-glow"></i><i class="lbow-plate">${BOW}</i></span></span>
          <div class="err">${icon("img-off", 32)}<p>Фото не загрузилось</p><button class="retry">Повторить</button></div>
        </div>
      </div>
      <div class="scrim-top"></div>
      <div class="segs-photo">${Array.from({ length: p.photos }, (_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>
      <button class="tap l" aria-label="Предыдущее фото"></button>
      <button class="tap r" aria-label="Следующее фото"></button>
      <div class="tint"></div>
      <div class="verdict" style="color: var(--mandarin-ink)">${icon("heart", 32)}</div>
      <div class="info">
        <span class="pill">${p.category}</span>
        <button class="info-btn" aria-label="Подробнее о подарке">
          <div>
            <h2>${p.title}</h2>
            <div class="meta">
              <span class="price">${p.price}</span>
              <span class="store">${icon("bag", 14)}${p.stores.join(", ")}</span>
              ${p.colors ? `<span class="swatches">${p.colors.map((c) => `<i style="background:${c[1]}"></i>`).join("")}</span>` : ""}
            </div>
          </div>
          ${icon("chev", 24)}
        </button>
      </div>
    </div>
    <div class="mini"><img alt="" src="${IMG(p.id, 1)}"><span>${p.title}</span></div>
    <div class="details">
      <section class="sec"><div class="sec-t">${icon("quote", 16)}Описание</div>
        <div class="sec-b">${p.description.map((d) => `<p>${d}</p>`).join("")}</div></section>
      ${p.colors ? `<section class="sec"><div class="sec-t">${icon("palette", 16)}Цвет</div>
        <div class="sec-b"><div class="vchips">${p.colors.map((c, i) => `<button class="vchip${i ? "" : " on"}">${i ? "" : icon("check", 16)}<i style="background:${c[1]}"></i>${c[0]}</button>`).join("")}</div>
        <div class="note">Мне подойдёт: коричневый. Друзья увидят это в вишлисте.</div></div></section>` : ""}
      <section class="sec"><div class="sec-t">${icon("bag", 16)}Где купить</div>
        <div class="sec-b">${p.offers.map((o) => `<div class="offer"><div><b>${o[0]}</b><div class="price">${o[1]}</div></div><a class="go" href="#">Открыть${icon("ext", 16)}</a></div>`).join("")}</div></section>
      <section class="sec"><div class="sec-t">${icon("spark", 16)}Подойдёт, если любишь</div>
        <div class="sec-b"><div class="ichips">${p.interests.map((t) => `<span>${t}</span>`).join("")}</div></div></section>
    </div>
    <div class="bar">
      <div class="back"></div>
      <div class="row">
        <button class="b s" data-k="small" aria-label="Вернуть">${icon("undo", 20)}</button>
        <div class="mid">
          <button class="b l" data-k="x" aria-label="Мимо">${icon("x", 30)}</button>
          <button class="b l" data-k="heart" aria-label="Хочу">${icon("heart", 30)}</button>
        </div>
        <button class="b s" data-k="star" aria-label="Очень хочу">${icon("star", 26)}</button>
      </div>
    </div>
  </div>`;

const phoneHTML = (inner) => `
  <div class="phone">
    <div class="hdr"><h1>Подарки</h1><div class="acts"><span class="icon-btn">${icon("sliders", 22)}</span><span class="ava">А</span></div></div>
    <div class="ribbon"><span class="segs"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span><span>Ещё 3 — и можно отправить</span></div>
    <div class="chips"><span class="chip">до 10 000 сом ✕</span><span class="chip">Техника ✕</span></div>
    <div class="deck">${inner}</div>
    <nav class="tabbar">
      <span class="tab on">${icon("gift", 22)}Подарки</span><span class="tab">${icon("heart-o", 22)}Вишлист</span>
      <span class="tab">${icon("ticket", 22)}Планы</span><span class="tab">${icon("mail", 22)}Санта</span>
    </nav>
  </div>`;

// RGBA-интерполяция для «перетекания» кнопок по прогрессу прокрутки (как useTransform в tap-tap).
const mix = (a, b, t) => `rgba(${a.map((v, i) => (i < 3 ? Math.round(v + (b[i] - v) * t) : +(v + (b[i] - v) * t).toFixed(3))).join(",")})`;
const PAPER = [255, 241, 243], INK = [42, 16, 36], MAND = [255, 138, 61], MAND_INK = [184, 70, 14];
const applyProgress = (card, p) => {
  card.querySelector(".back").style.opacity = p;
  card.querySelectorAll(".b").forEach((b) => {
    const k = b.dataset.k;
    if (k === "x") {
      b.style.background = mix([...PAPER, 0.16], [...PAPER, 1], p);
      b.style.color = mix([...PAPER, 1], [...INK, 1], p);
    } else if (k === "heart") {
      b.style.background = mix([...MAND, 0.92], [...PAPER, 1], p);
      b.style.color = mix([...INK, 1], [...MAND_INK, 1], p);
    } else {
      b.style.background = mix([...PAPER, 0.18], [...PAPER, 1], p);
      b.style.color = mix([...PAPER, 1], [...INK, 1], p);
      b.style.boxShadow = `0 6px 16px rgba(10,0,8,${(0.25 * p).toFixed(3)})`;
    }
  });
};
/* Имитация сети. Файлы локальные и грузятся мгновенно, поэтому задержку
   и ошибку изображаем таймерами. Уже показанное фото — «в кеше»: второй раз
   появляется сразу. В приложении ошибка — по ответу сети или через 8 с. */
const NET = { mode: "preloaded" };
const MODES = [
  ["preloaded", "С предзагрузкой"],
  ["slow", "Медленная сеть"],
  ["error", "Ошибка сети"],
  ["old", "Как было до правки"],
];
const SLOW_MS = 2000, FAIL_MS = 1600, RETRY_MS = 1200;
const cache = new Set();
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// start: { index, from, state, cover } — кадр, застывший в состоянии загрузки.
const wire = (card, p, start = {}) => {
  let index = start.index ?? 0;
  const photo = card.querySelector(".photo");
  const pic = card.querySelector(".pic"), fill = card.querySelector(".fill");
  const segs = card.querySelectorAll(".segs-photo i");
  let timers = [], attempt = 0;
  // Новый тап отменяет всё, что ждало прошлое фото, в том числе его decode().
  const stop = () => { attempt++; timers.forEach(clearTimeout); timers = []; };
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  const setState = (s) => {
    photo.dataset.state = s;
    photo.setAttribute("aria-busy", String(s === "wave" || s === "bow"));
  };
  const put = (src) => { pic.src = src; fill.src = src; cache.add(src); delete photo.dataset.cover; };
  // Фото пришло и декодировано → проявляется за 160 ms вместе с размытой копией.
  const reveal = (src) => {
    put(src);
    const mine = attempt;
    let shown = false;
    const done = () => {
      if (shown || mine !== attempt) return; // успел новый тап — это фото уже не нужно
      shown = true;
      if (!reduce) { pic.classList.add("fade"); fill.classList.add("fade"); }
      setState("");
      at(220, () => { pic.classList.remove("fade"); fill.classList.remove("fade"); });
    };
    pic.decode().then(done, done);
    at(300, done); // запасной путь, если decode() не ответит
  };
  const load = (src, ok, ms) => {
    at(100, () => setState("wave")); // первые 100 ms держим прежнее фото
    at(400, () => setState("bow"));
    at(ms, () => (ok ? reveal(src) : setState("error")));
  };
  const show = (i) => {
    const next = Math.max(0, Math.min(p.photos - 1, i));
    if (next === index) return;
    index = next;
    segs.forEach((s, j) => s.classList.toggle("on", j === index)); // сегмент — сразу, 0 ms
    stop();
    const src = IMG(p.id, index + 1);
    if (NET.mode === "preloaded" || cache.has(src)) { put(src); setState(""); return; }
    if (NET.mode === "old") { setState(""); at(SLOW_MS, () => put(src)); return; } // прежнее фото висит
    load(src, NET.mode === "slow", NET.mode === "slow" ? SLOW_MS : FAIL_MS);
  };
  card.querySelector(".retry").onclick = (e) => {
    e.stopPropagation(); stop(); setState("wave");
    at(400, () => setState("bow"));
    at(RETRY_MS, () => reveal(IMG(p.id, index + 1)));
  };
  if (start.from) { pic.src = IMG(p.id, start.from); fill.src = IMG(p.id, start.from); }
  segs.forEach((s, j) => s.classList.toggle("on", j === index));
  if (start.cover) photo.dataset.cover = "";
  setState(start.state ?? "");
  card.querySelector(".tap.l").onclick = () => show(index - 1);
  card.querySelector(".tap.r").onclick = () => show(index + 1);
  card.querySelector(".info-btn").onclick = () => card.scrollTo({ top: card.clientHeight, behavior: "smooth" });
  card.addEventListener("scroll", () => applyProgress(card, Math.min(card.scrollTop / 120, 1)), { passive: true });
  card.querySelectorAll(".vchip").forEach((c) => (c.onclick = () => card.querySelectorAll(".vchip").forEach((o) => o.classList.toggle("on", o === c))));
  applyProgress(card, 0);
};

const FRAMES = [
  { cap: "1. Сверху: фото целиком, кнопки — стекло", top: "jbl", next: "bag", scroll: 0 },
  { cap: "2. Прокрутка вниз: кнопки перетекают в бумагу", top: "bag", next: "jbl", scroll: 70 },
  { cap: "3. Подробности: шапка прилипла", top: "bag", next: "jbl", scroll: "details" },
  { cap: "4. Тянешь вправо: «Хочу»", top: "engine", next: "jbl", scroll: 0, drag: 96 },
  { cap: "5. Фото не готово: с 100 ms перелив", top: "jbl", next: "bag", scroll: 0, start: { index: 1, from: 1, state: "wave" } },
  { cap: "6. Дольше 400 ms: бант", top: "bag", next: "engine", scroll: 0, start: { index: 2, from: 2, state: "bow" } },
  { cap: "7. Не загрузилось: «Повторить»", top: "engine", next: "bag", scroll: 0, start: { index: 1, from: 1, state: "error" } },
  { cap: "8. Обложка не успела: свайпать можно", top: "jbl", next: "engine", scroll: 0, start: { index: 0, state: "bow", cover: true } },
];

const PANEL = `
  <section class="panel">
    <h2>Смена и загрузка фото</h2>
    <div class="net" role="group" aria-label="Сеть в живых карточках"><span>Сеть:</span>
      ${MODES.map(([m, label]) => `<button data-mode="${m}" aria-pressed="${m === NET.mode}">${label}</button>`).join("")}
    </div>
    <p class="hint">Тапай по правой половине фото в любой карточке. «С предзагрузкой» — так должно быть почти всегда: фото меняется в тот же кадр. «Медленная сеть» — новое фото приходит через 2 с, уже показанное — сразу. «Ошибка сети» — через 1,6 с сеть ответила ошибкой, «Повторить» срабатывает. «Как было до правки» — сегмент переключился, а прежнее фото висит 2 с. Смена режима очищает кеш.</p>
    <ol class="steps">
      <li><b>0 ms</b>сегмент переключился</li>
      <li><b>до 100 ms</b>прежнее фото</li>
      <li><b>100 ms</b>перелив</li>
      <li><b>400 ms</b>бант</li>
      <li class="ok"><b>фото пришло</b>проявление за 160 ms</li>
      <li><b>ошибка или 8 с</b>«Фото не загрузилось»</li>
    </ol>
  </section>`;

document.body.innerHTML = PANEL + FRAMES.map((f) => `<figure>${phoneHTML(cardHTML(PRODUCTS[f.next], true) + cardHTML(PRODUCTS[f.top]))}<figcaption>${f.cap}</figcaption></figure>`).join("");
document.querySelectorAll(".net button").forEach((b) => (b.onclick = () => {
  NET.mode = b.dataset.mode;
  document.querySelectorAll(".net button").forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
  cache.clear();
  // То, что сейчас на экране, уже скачано.
  document.querySelectorAll(".photo:not([data-state='wave']):not([data-state='bow']):not([data-state='error']) .pic").forEach((im) => cache.add(im.getAttribute("src")));
}));
document.querySelectorAll(".phone").forEach((phone, i) => {
  const f = FRAMES[i];
  const [under, top] = phone.querySelectorAll(".card");
  wire(top, PRODUCTS[f.top], f.start); applyProgress(under, 0);
  requestAnimationFrame(() => {
    top.scrollTop = f.scroll === "details" ? top.clientHeight + 140 : f.scroll;
    applyProgress(top, Math.min(top.scrollTop / 120, 1));
    if (f.drag) {
      const x = f.drag;
      top.style.transform = `translateX(${x}px) rotate(${(x / 200) * 12}deg)`;
      top.querySelector(".tint").style.background = `rgba(255,138,61,${Math.min(x / 160, 1) * 0.35})`;
      top.querySelector(".verdict").style.opacity = Math.max(0, Math.min((x - 20) / 100, 1));
      under.style.transform = `scale(${0.95 + 0.05 * Math.min(x / 120, 1)})`;
    }
  });
});
</script>
</body>
</html>
