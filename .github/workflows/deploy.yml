# Проверки и публикация (TECH_SPEC §13, BACKEND.md §11.5).
# Каждый push в main: проверки фронта и сервера — параллельно. Демо на GitHub
# Pages собирается с basePath /swipeit и зависит только от фронта: сервер
# демо не трогает. Если `check` фронта упал — деплоя нет.
# После обеих проверок — deploy-smoke: пакет администратора (backend/deploy/)
# на пустой базе, а на main — образы api и web в GHCR.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; начатый не отменяем, чтобы сайт не остался полусобранным.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Хуки git в CI не нужны.
  HUSKY: 0

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/configure-pages@v6

      # Рабочее пространство npm: один lockfile в корне.
      - run: npm ci
      - run: npm run catalog:sync -w frontend
      # Общий контракт и чистая логика — их собирает и фронт, и сервер.
      - run: npm run check -w @swipeit/core
      - run: npm run check -w frontend
      - run: npm run build -w frontend
        env:
          NEXT_PUBLIC_BASE_PATH: /swipeit

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/out

  backend:
    runs-on: ubuntu-latest
    # Postgres для тестов сервера (BACKEND.md §12); схема — с задачи B03.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: swipeit
          POSTGRES_PASSWORD: swipeit
          POSTGRES_DB: swipeit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swipeit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TZ: Asia/Bishkek
      DATABASE_URL: postgres://swipeit:swipeit@localhost:5432/swipeit_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run check -w backend
      - run: npm run build -w backend

  # Пакет администратора (B18; auto-tasks-pm-4 S01, S02): образы api и web,
  # backend/deploy/docker-compose.yml на пустой базе и команды из ADMIN.md —
  # миграции, отчёт, бэкап, восстановление, откат. На main образы уходят в
  # GHCR с тегами коммита и staging. Демо на Pages от этой задачи не зависит.
  deploy-smoke:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: backend/deploy
    env:
      API_IMAGE: ghcr.io/seitek2002/swipeit-api
      WEB_IMAGE: ghcr.io/seitek2002/swipeit-web
      BASE: http://localhost:8080
    steps:
      - uses: actions/checkout@v7

      # Для проверки WebSocket: в Node 24 он встроен.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Тег — короткий хеш коммита
        run: |
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "Тег образов: ${GITHUB_SHA::7}"

      - name: Скрипты и Caddyfile профиля caddy
        run: |
          shellcheck --shell=sh --severity=warning scripts/*.sh
          docker run --rm -e SITE_ADDRESS=swipeit.example.kg \
            -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Образ api (и второй — для проверки отката)
        working-directory: .
        run: |
          docker build -f backend/Dockerfile --build-arg COMMIT="$TAG" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            -t "$API_IMAGE:$TAG" -t "$API_IMAGE:staging" .
          docker build -f backend/Dockerfile --build-arg COMMIT="$TAG-prev" \
            -t "$API_IMAGE:$TAG-prev" .

      - name: Образ web (фронт с NEXT_PUBLIC_API_URL=same-origin)
        working-directory: .
        env:
          # Вход через Telegram (S03): Client ID бота — переменная репозитория
          # (Settings → Secrets and variables → Actions → Variables), он не
          # секрет. Нет переменной — кнопок входа нет.
          TELEGRAM_CLIENT_ID: ${{ vars.TELEGRAM_CLIENT_ID }}
          # Несколько вишлистов в продукте — переменная репозитория
          # MULTI_WISHLISTS=1 (ADMIN.md §15). Нет переменной — выключено.
          MULTI_WISHLISTS: ${{ vars.MULTI_WISHLISTS || "0" }}
        run: |
          docker build -f backend/deploy/web/Dockerfile \
            --build-arg CLIENT_BUILD="$GITHUB_RUN_NUMBER" \
            --build-arg TELEGRAM_CLIENT_ID="$TELEGRAM_CLIENT_ID" \
            --build-arg MULTI_WISHLISTS="$MULTI_WISHLISTS" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            -t "$WEB_IMAGE:$TAG" -t "$WEB_IMAGE:staging" .

      - name: Тестовый .env из .env.example
        run: |
          cp .env.example .env
          set_env() {
            if grep -q "^$1=" .env; then sed -i "s|^$1=.*|$1=$2|" .env
            else echo "$1=$2" >> .env; fi
          }
          ops_token=$(openssl rand -hex 24)
          echo "::add-mask::$ops_token"
          echo "OPS_TOKEN=$ops_token" >> "$GITHUB_ENV"
          set_env API_TAG "$TAG"
          set_env WEB_TAG "$TAG"
          set_env POSTGRES_PASSWORD "$(openssl rand -hex 16)"
          set_env PUBLIC_APP_URL "$BASE"
          set_env PUBLIC_SHARE_URL "$BASE"
          set_env OPS_TOKEN "$ops_token"
          set_env BACKUP_ENCRYPT_KEY "$(openssl rand -hex 32)"
          docker compose config --quiet
          docker compose --profile caddy config --quiet

      - name: docker compose up -d на пустой базе
        run: |
          docker compose up -d
          for _ in $(seq 1 60); do
            curl -fsS "$BASE/v1/health" > health.json 2>/dev/null && break
            sleep 2
          done
          docker compose ps
          docker compose logs migrate | tee migrate.log
          grep -q "Миграции применены" migrate.log
          jq . health.json
          jq -e --arg commit "$TAG" '.commit == $commit' health.json

      - name: Фронт с того же адреса
        run: |
          curl -fsS "$BASE/" -o index.html
          grep -q "<html" index.html
          curl -fsS -o /dev/null -w "%{http_code} /santa/join/\n" "$BASE/santa/join/"
          curl -fsS -o /dev/null -w "%{http_code} /w/\n" "$BASE/w/"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/santa/join")
          echo "$code /santa/join -> /santa/join/"
          test "$code" = 308
          code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/net-takoi-stranicy/")
          echo "$code /net-takoi-stranicy/"
          test "$code" = 404
          curl -fsSI "$BASE/sw.js" | tee sw.headers
          grep -qi "^cache-control: no-cache" sw.headers
          chunk=$(grep -o '/_next/static/[^"]*\.js' index.html | head -n 1)
          curl -fsSI "$BASE$chunk" | tee chunk.headers
          grep -qi "^cache-control:.*immutable" chunk.headers
          curl -fsSI "$BASE/" > index.headers
          if grep -qi "^cross-origin-opener-policy" index.headers; then
            echo "COOP ломает вход через Telegram"; exit 1
          fi

      - name: Профиль, 5 «Хочу» и превью ссылки
        run: |
          json='content-type: application/json'
          curl -fsS -X POST -H "$json" -d '{}' "$BASE/v1/users" > user.json
          token=$(jq -r .token user.json)
          echo "::add-mask::$token"
          echo "TOKEN=$token" >> "$GITHUB_ENV"
          auth="authorization: Bearer $token"
          curl -fsS -X PATCH -H "$auth" -H "$json" -d '{"name":"Айгуль"}' "$BASE/v1/me" > /dev/null
          for i in 1 2 3 4 5; do
            curl -fsS -X POST -H "$auth" -H "$json" -d "{\"title\":\"Хочу $i\"}" \
              "$BASE/v1/wishlist/items" > wish.json
          done
          jq -e '.wishCount == 5' wish.json
          curl -fsS -X POST -H "$auth" -H "$json" -d '{}' "$BASE/v1/wishlist/share" > share.json
          code=$(jq -r .code share.json)
          echo "SHARE_CODE=$code" >> "$GITHUB_ENV"
          curl -fsS -A "TelegramBot (like TwitterBot)" "$BASE/s/$code" > preview.html
          grep 'og:title' preview.html
          grep -q 'property="og:title" content="Вишлист' preview.html
          grep -qF "$BASE/w/?s=$code" preview.html

      - name: WebSocket через web — hello → ready
        run: node ci/ws-hello.mjs "ws://localhost:8080/v1/ws" "$TOKEN"

      # Репетиция офиса (S06): 10 человек через web — как после обновления
      # у администратора. Профили создаются не быстрее 20 в минуту (≈30 с+).
      - name: Репетиция — 10 человек через web
        run: |
          docker compose exec -T api node dist/rehearsal.js             --api http://web:8080 --people 10 --ops-token "$OPS_TOKEN"

      - name: Отчёт для владельца
        run: |
          docker compose exec -T api node dist/funnel.js --days 1 --live
          docker compose exec -T api node dist/funnel-team.js "$SHARE_CODE"
          docker compose exec -T api node dist/funnel-team.js "$SHARE_CODE" --undo
          curl -fsS -H "authorization: Bearer $OPS_TOKEN" "$BASE/v1/ops/report" > report.txt
          head -n 40 report.txt

      - name: Бэкап → восстановление в отдельную базу
        run: |
          docker compose exec -T backup sh /scripts/backup.sh
          docker compose exec -T backup ls -lh /backups/daily /backups/weekly
          dump=$(docker compose exec -T backup sh -c 'ls -1 /backups/daily/db-*.dump | tail -n 1')
          docker compose exec -T backup sh /scripts/restore.sh "$dump" | tee restore.txt
          grep -q "Расхождений нет" restore.txt
          # Зашифрованная копия (как во внешнем хранилище) тоже открывается.
          docker compose exec -T backup sh -c '
            command -v openssl >/dev/null || apk add --no-cache openssl >/dev/null
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
              -pass env:BACKUP_ENCRYPT_KEY -in "$0" -out /tmp/db.dump.enc' "$dump"
          docker compose exec -T backup sh /scripts/restore.sh /tmp/db.dump.enc swipeit_restore_enc | tee restore-enc.txt
          grep -q "Расхождений нет" restore-enc.txt

      - name: Восстановление рабочей базы и фото (как в ADMIN.md)
        run: |
          docker compose stop api web
          docker compose exec -T backup psql -d postgres -c 'alter database swipeit rename to swipeit_old'
          docker compose exec -T backup psql -d postgres -c 'alter database swipeit_restore rename to swipeit'
          archive=$(docker compose exec -T backup sh -c 'ls -1 /backups/daily/uploads-*.tar.gz | tail -n 1')
          docker compose exec -T backup cat "$archive" |
            docker compose run --rm --no-deps -T --entrypoint sh api -c 'tar -xzf - -C /data/uploads'
          docker compose up -d
          for _ in $(seq 1 60); do
            curl -fsS "$BASE/v1/health" > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS -H "authorization: Bearer $TOKEN" "$BASE/v1/wishlist" | jq -e '.wishCount == 5'
          docker compose exec -T backup dropdb swipeit_restore_enc
          docker compose exec -T backup dropdb swipeit_old

      - name: Откат на прошлый тег
        run: |
          API_TAG="$TAG-prev" docker compose up -d api
          commit=""
          for _ in $(seq 1 60); do
            commit=$(curl -fsS "$BASE/v1/health" 2>/dev/null | jq -r .commit || true)
            [ "$commit" = "$TAG-prev" ] && break
            sleep 2
          done
          echo "После отката /v1/health: commit=$commit"
          test "$commit" = "$TAG-prev"
          # И обратно на текущий.
          docker compose up -d api

      - name: Логи контейнеров
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Образы в GHCR (теги коммита и staging)
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for image in "$API_IMAGE" "$WEB_IMAGE"; do
            docker push "$image:$TAG"
            docker push "$image:staging"
          done
          # Как у администратора: образы скачиваются из GHCR.
          docker compose pull api web

  deploy:
    needs: frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
