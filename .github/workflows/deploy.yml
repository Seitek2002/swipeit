# Сборка и публикация демо на GitHub Pages (TECH_SPEC §13).
# Каждый push в main: проверки → статическая сборка с basePath /swipeit →
# деплой. Если `npm run check` упал — деплоя нет.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; начатый не отменяем, чтобы сайт не остался полусобранным.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Хуки git в CI не нужны.
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/configure-pages@v6

      - run: npm ci
      - run: npm run catalog:sync
      - run: npm run check
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /swipeit

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
